name: Release latest

on:
  push:
    branches: master
    paths:
      - 'src/**'
      - '.github/workflows/release-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  publish:
    name: Publish linux-x64 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish
        run: |
          dotnet publish ./src/Impostor.Server/Impostor.Server.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:VersionSuffix=ci.${{ github.run_number }} \
            -p:SourceRevisionId=${{ github.sha }} \
            -o ./publish

      - name: Package
        run: |
          mkdir -p ./release
          tar -czf ./release/Impostor-Server_linux-x64.tar.gz -C ./publish .
          (cd ./release && sha256sum Impostor-Server_linux-x64.tar.gz > Impostor-Server_linux-x64.tar.gz.sha256)
          echo "${GITHUB_SHA}" > ./release/version.txt

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ./release/* \
            --target "${GITHUB_SHA}" \
            --title "latest" \
            --notes "Automated build of ${GITHUB_SHA}" \
            --prerelease
